<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Master Scărița: Puzzle-ul Unităților Finale</title>
    <style>
        :root { --blue: #2563eb; --orange: #f59e0b; --green: #10b981; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; color: #1e293b; }
        .app { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 1100px; border: 4px solid var(--blue); }
        
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        .tab { padding: 10px 15px; border: none; background: #e2e8f0; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .tab.active { background: var(--blue); color: white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(37,99,235,0.2); }

        .staircase { display: flex; align-items: flex-end; justify-content: center; height: 280px; gap: 8px; margin: 20px 0; background: #f1f5f9; padding: 20px; border-radius: 20px; overflow-x: auto; }
        .step { flex: 1; background: #cbd5e1; border-radius: 8px 8px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 10px; transition: 0.3s; min-width: 90px; border: 1px solid #94a3b8; }
        .step.active { background: var(--orange); color: white; border-color: #d97706; }
        .step span { font-weight: 900; font-size: 1.1rem; margin-bottom: 5px; }
        .step small { font-size: 0.65rem; text-align: center; padding: 0 4px; line-height: 1.2; font-weight: 600; }

        .controls { background: #f1f5f9; padding: 20px; border-radius: 20px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: center; border: 1px solid #e2e8f0; }
        select, input { padding: 12px; border-radius: 10px; border: 2px solid #cbd5e1; font-weight: bold; font-size: 1rem; color: var(--blue); outline: none; }
        
        .puzzle-box { margin-top: 25px; padding: 25px; background: #f0fdf4; border-radius: 20px; border-left: 8px solid var(--green); box-shadow: 0 4px 15px rgba(16,185,129,0.1); }
        .big-text { font-size: 1.5rem; color: #166534; font-weight: 700; line-height: 1.5; }
        .highlight { color: var(--blue); text-decoration: underline; font-weight: 900; }

        .math-logic { margin-top: 15px; padding: 15px; background: #fffbeb; border-radius: 12px; border: 1px dashed #f59e0b; color: #92400e; font-size: 1rem; }
        .formula-style { font-family: 'Courier New', monospace; font-weight: bold; background: #fef3c7; padding: 2px 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="app">
    <h1 style="text-align:center; color:var(--blue); margin-top:0; text-transform: uppercase; letter-spacing: 1px;">📐 Fizica: Din ce e făcută unitatea?</h1>
    
    <div class="tabs" id="tabList"></div>

    <div class="staircase" id="stairDisplay"></div>

    <div class="controls">
        <input type="number" id="numInput" value="1" style="width:100px" oninput="run()">
        <select id="selectFrom" onchange="run()"></select>
        <span style="font-size: 1.5rem;">➡️</span>
        <select id="selectTo" onchange="run()"></select>
    </div>

    <div class="puzzle-box">
        <div id="puzzleOutput" class="big-text">Selectează unitățile...</div>
        <div id="mathExplanation" class="math-logic" style="display:none;"></div>
    </div>
</div>

<script>
    const CONFIG = {
        "Lungime": {
            factor: 10,
            data: [
                { u: "km", o: "un Traseu de 15 min" }, { u: "hm", o: "un Stadion" }, { u: "dam", o: "un Autobuz" },
                { u: "m", o: "o Chitară" }, { u: "dm", o: "o Palmă" }, { u: "cm", o: "o Pastilă" }, { u: "mm", o: "un Card" }
            ]
        },
        "Masă": {
            factor: 10,
            data: [
                { u: "t", o: "un Elefant" }, { u: "q", o: "un Sac de grâu" }, { u: "kg", o: "o Sticlă de lapte" },
                { u: "hg", o: "un Măr" }, { u: "dag", o: "o Bomboană" }, { u: "g", o: "o Agrafă" },
                { u: "dg", o: "un Bob de orez" }, { u: "cg", o: "un Praf de sare" }, { u: "mg", o: "o Furnică" }
            ]
        },
        "Suprafață (x100)": {
            factor: 100,
            data: [
                { u: "km²", o: "un Oraș mic" }, { u: "ha", o: "un Teren de fotbal" }, { u: "ar", o: "o Grădină" },
                { u: "m²", o: "un Dormitor" }, { u: "dm²", o: "un Laptop" }, { u: "cm²", o: "o Monedă" }, { u: "mm²", o: "un Vârf de ac" }
            ]
        },
        "Volum (x1000)": {
            factor: 1000,
            data: [
                { u: "km³", o: "un Munte" }, { u: "hm³", o: "un Stadion plin" }, { u: "dam³", o: "un Bloc" },
                { u: "m³", o: "o Cutie TV mare" }, { u: "dm³", o: "un Pahar" }, { u: "cm³", o: "un Zar" }, { u: "mm³", o: "o Picătură" }
            ]
        },
        "Energie": {
            factor: 10,
            data: [
                { u: "kJ", o: "un Șut de fotbalist" }, { u: "hJ", o: "o Săritură" }, { u: "daJ", o: "o Bătaie din palme" },
                { u: "J", o: "o Scânteie" }, { u: "dJ", o: "un Clipit" }, { u: "cJ", o: "o Mișcare de deget" }, { u: "mJ", o: "o Albină care zboară" }
            ]
        }
    };

    let activeCat = "Lungime";

    function build() {
        const tabs = document.getElementById('tabList');
        tabs.innerHTML = "";
        Object.keys(CONFIG).forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'tab' + (cat === activeCat ? ' active' : '');
            btn.innerText = cat;
            btn.onclick = () => { activeCat = cat; build(); };
            tabs.appendChild(btn);
        });

        const f = document.getElementById('selectFrom');
        const t = document.getElementById('selectTo');
        f.innerHTML = ""; t.innerHTML = "";
        CONFIG[activeCat].data.forEach((d, i) => {
            f.options.add(new Option(d.u, i));
            t.options.add(new Option(d.u, i));
        });
        t.selectedIndex = Math.min(1, CONFIG[activeCat].data.length - 1);
        run();
    }

    function run() {
        const val = parseFloat(document.getElementById('numInput').value) || 0;
        const fIdx = parseInt(document.getElementById('selectFrom').value);
        const tIdx = parseInt(document.getElementById('selectTo').value);
        const cat = CONFIG[activeCat];

        const stair = document.getElementById('stairDisplay');
        stair.innerHTML = "";
        cat.data.forEach((d, i) => {
            const step = document.createElement('div');
            step.className = 'step' + (i === fIdx || i === tIdx ? ' active' : '');
            step.style.height = `${(cat.data.length - i) * 25 + 45}px`;
            step.innerHTML = `<span>${d.u}</span><small>${d.o}</small>`;
            stair.appendChild(step);
        });

        const distanta = tIdx - fIdx; 
        const ratio = Math.pow(cat.factor, Math.abs(distanta));
        let rezultat;
        let explicatie = "";

        if (distanta > 0) {
            rezultat = val * ratio;
            explicatie = `Coborâm <b>${distanta}</b> trepte. Înmulțim cu <span class="formula-style">${cat.factor}<sup>${distanta}</sup></span>.`;
        } else if (distanta < 0) {
            rezultat = val / ratio;
            explicatie = `Urcăm <b>${Math.abs(distanta)}</b> trepte. Împărțim la <span class="formula-style">${cat.factor}<sup>${Math.abs(distanta)}</sup></span>.`;
        } else {
            rezultat = val;
            explicatie = "Unitățile sunt identice.";
        }

        // PĂSTREAZĂ OBIECTELE ORIGINALE ÎN TEXT (ex: o Sticlă de lapte)
        const obiectStart = cat.data[fIdx].o;
        const obiectFinal = cat.data[tIdx].o;
        
        document.getElementById('puzzleOutput').innerHTML = 
            `🧠 <b>Rețeta de construcție:</b><br>
            Pentru <span class="highlight">${val} x [${obiectStart}]</span>,<br>
            obții <b style="color:var(--orange)">${rezultat.toLocaleString('ro-RO', {maximumFractionDigits: 6})}</b> piese de tip <span class="highlight">[${obiectFinal}]</span>!`;

        const expDiv = document.getElementById('mathExplanation');
        expDiv.style.display = "block";
        expDiv.innerHTML = `💡 <b>Cum am calculat:</b> ${explicatie}<br>
        <span class="formula-style">Calcul: ${val} ${distanta >= 0 ? '×' : '÷'} ${ratio.toLocaleString()} = ${rezultat.toLocaleString('ro-RO', {maximumFractionDigits: 6})}</span>`;
    }

    build();
</script>
</body>
</html>
