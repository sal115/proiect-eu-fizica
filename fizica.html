<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizica Pro - Scărița Completă</title>
    <style>
        :root { --primary: #2563eb; --accent: #f59e0b; --bg: #f1f5f9; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: #cbd5e1; display: flex; justify-content: center; padding: 20px; color: #1e293b; }
        .container { background: var(--white); padding: 30px; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 900px; }
        h1 { text-align: center; color: var(--primary); margin-bottom: 25px; font-size: 1.8rem; }
        
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; justify-content: center; }
        .tab-btn { padding: 10px 15px; border: none; background: #e2e8f0; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; transform: translateY(-2px); }

        .staircase-scroll { overflow-x: auto; background: #f8fafc; border-radius: 15px; padding: 20px; margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .staircase { display: flex; align-items: flex-end; justify-content: center; min-width: 800px; height: 180px; gap: 10px; }
        .step { flex: 1; background: #94a3b8; border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 0.7rem; transition: 0.4s; min-height: 40px; position: relative; }
        .step.start { background: var(--primary); height: 100% !important; box-shadow: 0 0 20px rgba(37,99,235,0.4); }
        .step.end { background: var(--accent); height: 100% !important; box-shadow: 0 0 20px rgba(245,158,11,0.4); }

        .calc-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; background: #f1f5f9; padding: 20px; border-radius: 20px; }
        input, select { padding: 14px; border: 2px solid #cbd5e0; border-radius: 12px; font-size: 1rem; font-weight: bold; width: 100%; outline: none; }
        input:focus { border-color: var(--primary); }

        .result-box { grid-column: span 3; background: white; padding: 25px; border-radius: 15px; text-align: center; border: 3px solid var(--primary); margin-top: 10px; }
        #resText { font-size: 2rem; font-weight: 900; color: var(--primary); margin-bottom: 15px; word-break: break-all; }
        
        .expl-card { text-align: left; background: #fffbeb; border-left: 5px solid var(--accent); padding: 15px; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; }
        .history { margin-top: 30px; border-top: 2px solid #e2e8f0; padding-top: 20px; }
        .hist-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Scărița Fizicii Interactivă</h1>
    <div class="tabs" id="tabsBox"></div>

    <div class="staircase-scroll">
        <div class="staircase" id="stairVisual"></div>
    </div>

    <div class="calc-grid">
        <input type="number" id="numIn" value="1" oninput="calculate()">
        <select id="selFrom" onchange="calculate()"></select>
        <select id="selTo" onchange="calculate()"></select>

        <div class="result-box">
            <div id="resText">1 m = 1 m</div>
            <div class="expl-card" id="explBox"></div>
        </div>
    </div>

    <div class="history">
        <h4 style="margin-bottom:10px">🕒 Istoric Conversii:</h4>
        <div id="histBox"></div>
    </div>
</div>

<script>
    const DATA = {
        "Lungime": { units: ["km", "hm", "dam", "m", "dm", "cm", "mm"], factor: 10 },
        "Masă": { units: ["t", "q", "kg", "hg", "dag", "g", "dg", "cg", "mg"], factor: 10 },
        "Suprafață": { units: ["km²", "hm²(ha)", "dam²(ar)", "m²", "dm²", "cm²", "mm²"], factor: 100 },
        "Volum (m³)": { units: ["km³", "hm³", "dam³", "m³", "dm³", "cm³", "mm³"], factor: 1000 },
        "Capacitate (L)": { units: ["kl", "hl", "dal", "l", "dl", "cl", "ml"], factor: 10 },
        "Energie (J)": { units: ["kJ", "hJ", "daJ", "J", "dJ", "cJ", "mJ"], factor: 10 },
        "Forță (N)": { units: ["kN", "hN", "daN", "N", "dN", "cN", "mN"], factor: 10 },
        "Putere (W)": { units: ["kW", "hW", "daW", "W", "dW", "cW", "mW"], factor: 10 }
    };

    let currentCat = "Lungime";
    let history = [];

    function setup() {
        const tBox = document.getElementById('tabsBox');
        tBox.innerHTML = "";
        Object.keys(DATA).forEach(cat => {
            const b = document.createElement('button');
            b.className = `tab-btn ${cat === currentCat ? 'active' : ''}`;
            b.innerText = cat;
            b.onclick = () => { currentCat = cat; setup(); };
            tBox.appendChild(b);
        });

        const f = document.getElementById('selFrom');
        const t = document.getElementById('selTo');
        f.innerHTML = ""; t.innerHTML = "";
        DATA[currentCat].units.forEach((u, i) => {
            f.options.add(new Option(u, i));
            t.options.add(new Option(u, i));
        });
        t.selectedIndex = DATA[currentCat].units.length - 1;
        calculate(false);
    }

    function calculate(save = true) {
        const val = parseFloat(document.getElementById('numIn').value) || 0;
        const fIdx = parseInt(document.getElementById('selFrom').value);
        const tIdx = parseInt(document.getElementById('selTo').value);
        const config = DATA[currentCat];

        // Scărița
        const sVisual = document.getElementById('stairVisual');
        sVisual.innerHTML = "";
        config.units.forEach((u, i) => {
            const d = document.createElement('div');
            d.className = 'step' + (i === fIdx ? ' start' : '') + (i === tIdx ? ' end' : '');
            d.style.height = `${40 + (config.units.length - i) * 15}px`;
            d.innerText = u;
            sVisual.appendChild(d);
        });

        // Matematică
        let steps = Math.abs(tIdx - fIdx);
        let totalFactor = Math.pow(config.factor, steps);
        let result = fIdx < tIdx ? val * totalFactor : val / totalFactor;

        let resFinal = `${val} ${config.units[fIdx]} = ${result.toLocaleString('ro-RO')} ${config.units[tIdx]}`;
        document.getElementById('resText').innerText = resFinal;

        // Explicație
        let op = fIdx < tIdx ? "înmulțim (×)" : "împărțim (÷)";
        document.getElementById('explBox').innerHTML = 
            `<b>Analiză:</b> Ai ${fIdx < tIdx ? 'coborât' : 'urcat'} <b>${steps} trepte</b>.<br>` +
            `Fiecare treaptă pe scara <b>${currentCat}</b> valorează <b>${config.factor}</b>.<br>` +
            `<b>Calcul:</b> ${val} ${op} ${config.factor}<sup>${steps}</sup> (${totalFactor.toLocaleString()}) = <b>${result.toLocaleString('ro-RO')}</b>`;

        if(save && val !== 0) {
            if(history[0] !== resFinal) {
                history.unshift(resFinal);
                if(history.length > 5) history.pop();
                document.getElementById('histBox').innerHTML = history.map(h => `<div class="hist-item">${h} <span>✔</span></div>`).join('');
            }
        }
    }

    setup();
</script>
</body>
</html>
